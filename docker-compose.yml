services:

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: financeirodb
      POSTGRES_USER: teste
      POSTGRES_PASSWORD: teste

    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: financeiro-api
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/financeirodb
      DB_USERNAME: teste
      DB_PASSWORD: teste

      JWT_SECRET: minha-chave
      EXPIRATION_TIME: 3600

      CURRENCY_FREAKY_API_KEY: chave